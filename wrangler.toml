# Cloudflare Pages config for the Dovey Cakes Co. site (the v2 host: static Astro + /functions).
# Deploy: connect the GitHub repo in the Cloudflare dashboard (Workers & Pages > Create > Pages),
# build command `npm run build`, output `dist`, env vars SITE_URL + SITE_BASE=/ (see SETUP.md).
name = "dovey-cakes-co"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Optional: per-IP rate limit for the AI cake-idea endpoint (5 requests a minute).
# [[ratelimits]]
# name = "IDEA_LIMITER"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }

# Optional: KV namespace for the daily cap on AI image generations.
# [[kv_namespaces]]
# binding = "IDEA_KV"
# id = "<kv namespace id>"
